<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>تعديل المنتج - شركة الكوتشيات</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Tahoma, sans-serif;
        }

        body {
            background: #f3f6fa;
            color: #172033;
        }

        header {
            background: #111827;
            color: white;
            padding: 20px 40px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 23px;
            font-weight: bold;
        }

        .logo span {
            color: #60a5fa;
        }

        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 20px;
        }

        .title {
            margin-bottom: 25px;
        }

        .title h1 {
            font-size: 30px;
            margin-bottom: 8px;
        }

        .title p {
            color: #6b7280;
        }

        .form-card {
            background: white;
            border-radius: 20px;
            padding: 30px;

            box-shadow:
                0 8px 30px rgba(0,0,0,0.07);
        }

        .search {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        .search input {
            flex: 1;
            padding: 14px;

            border: 1px solid #d9dee7;
            border-radius: 10px;

            font-size: 16px;
            outline: none;
        }

        .search button {
            background: #2563eb;
            color: white;
            border: none;

            padding: 0 25px;
            border-radius: 10px;

            cursor: pointer;
            font-size: 16px;
        }

        .form-grid {
            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 20px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .full {
            grid-column: 1 / -1;
        }

        label {
            font-weight: bold;
        }

        input,
        select {
            padding: 13px;

            border:
                1px solid #d9dee7;

            border-radius: 10px;

            font-size: 16px;

            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #2563eb;
        }

        .sizes {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .size {
            padding: 10px 14px;

            border: 1px solid #dbe2ea;

            border-radius: 8px;

            cursor: pointer;

            background: #f8fafc;
        }

        .size.active {
            background: #2563eb;
            color: white;
            border-color: #2563eb;
        }

        .buttons {
            margin-top: 30px;

            display: flex;
            gap: 10px;
        }

        button {
            border: none;

            padding: 13px 22px;

            border-radius: 10px;

            cursor: pointer;

            font-size: 15px;
        }

        .save {
            background: #2563eb;
            color: white;
        }

        .cancel {
            background: #e5e7eb;
        }

        .delete {
            background: #fee2e2;
            color: #991b1b;
        }

        .message {
            display: none;

            margin-bottom: 20px;

            padding: 15px;

            border-radius: 10px;

            background: #dcfce7;
            color: #166534;

            font-weight: bold;
        }

        .not-found {
            display: none;

            margin-bottom: 20px;

            padding: 15px;

            border-radius: 10px;

            background: #fee2e2;
            color: #991b1b;

            font-weight: bold;
        }

        @media(max-width:700px) {

            .form-grid {
                grid-template-columns: 1fr;
            }

            .full {
                grid-column: auto;
            }

            .search {
                flex-direction: column;
            }

            .search button {
                padding: 13px;
            }

            header {
                padding: 18px;
            }
        }

    </style>

</head>

<body>


<header>

    <div class="logo">

        👟 <span>شركة الكوتشيات</span>

    </div>

    <div>
        تعديل المنتج
    </div>

</header>


<div class="container">


    <div class="title">

        <h1>✏️ تعديل المنتج</h1>

        <p>
            ابحث عن المنتج ثم قم بتعديل بياناته
        </p>

    </div>


    <div class="form-card">


        <!-- البحث عن المنتج -->

        <div class="search">

            <input
                type="text"
                id="searchInput"
                placeholder="🔎 اكتب اسم المنتج أو الكود..."
            >

            <button onclick="findProduct()">
                بحث
            </button>

        </div>


        <div
            class="message"
            id="success">
            ✅ تم تعديل المنتج بنجاح
        </div>


        <div
            class="not-found"
            id="notFound">
            ❌ المنتج غير موجود
        </div>


        <!-- الفورم -->

        <form id="editForm">


            <div class="form-grid">


                <div class="input-group">

                    <label>
                        اسم المنتج
                    </label>

                    <input
                        type="text"
                        id="name"
                        required
                    >

                </div>


                <div class="input-group">

                    <label>
                        كود المنتج
                    </label>

                    <input
                        type="text"
                        id="code"
                        required
                    >

                </div>


                <div class="input-group">

                    <label>
                        الماركة
                    </label>

                    <input
                        type="text"
                        id="brand"
                    >

                </div>


                <div class="input-group">

                    <label>
                        النوع
                    </label>

                    <select id="type">

                        <option value="">
                            اختر النوع
                        </option>

                        <option value="رياضي">
                            رياضي
                        </option>

                        <option value="جري">
                            جري
                        </option>

                        <option value="كاجوال">
                            كاجوال
                        </option>

                        <option value="كرة قدم">
                            كرة قدم
                        </option>

                        <option value="أطفال">
                            أطفال
                        </option>

                        <option value="آخر">
                            آخر
                        </option>

                    </select>

                </div>


                <div class="input-group">

                    <label>
                        اللون
                    </label>

                    <input
                        type="text"
                        id="color"
                    >

                </div>


                <div class="input-group">

                    <label>
                        سعر البيع
                    </label>

                    <input
                        type="number"
                        id="price"
                        min="0"
                        required
                    >

                </div>


                <div class="input-group">

                    <label>
                        الكمية
                    </label>

                    <input
                        type="number"
                        id="quantity"
                        min="0"
                        required
                    >

                </div>


                <div class="input-group">

                    <label>
                        المقاسات
                    </label>

                    <div class="sizes">

                        <div class="size"
                             data-size="36">
                            36
                        </div>

                        <div class="size"
                             data-size="37">
                            37
                        </div>

                        <div class="size"
                             data-size="38">
                            38
                        </div>

                        <div class="size"
                             data-size="39">
                            39
                        </div>

                        <div class="size"
                             data-size="40">
                            40
                        </div>

                        <div class="size"
                             data-size="41">
                            41
                        </div>

                        <div class="size"
                             data-size="42">
                            42
                        </div>

                        <div class="size"
                             data-size="43">
                            43
                        </div>

                        <div class="size"
                             data-size="44">
                            44
                        </div>

                        <div class="size"
                             data-size="45">
                            45
                        </div>

                    </div>

                </div>


            </div>


            <div class="buttons">

                <button
                    type="submit"
                    class="save">

                    💾 حفظ التعديلات

                </button>

                <button
                    type="button"
                    class="cancel"
                    onclick="clearForm()">

                    مسح

                </button>

                <button
                    type="button"
                    class="delete"
                    onclick="deleteCurrentProduct()">

                    🗑️ حذف المنتج

                </button>

            </div>


        </form>

    </div>

</div>


<script>

let products =
    JSON.parse(
        localStorage.getItem("products")
    ) || [];


let currentProductId = null;


/*
    المقاسات
*/

document
    .querySelectorAll(".size")
    .forEach(function(size) {

        size.addEventListener(
            "click",
            function() {

                size.classList.toggle("active");

            }
        );

    });


/*
    البحث عن المنتج
*/

function findProduct() {

    const text =
        document
        .getElementById("searchInput")
        .value
        .trim()
        .toLowerCase();


    if (!text) {

        alert(
            "اكتب اسم المنتج أو الكود"
        );

        return;

    }


    const product =
        products.find(function(item) {

            return (

                item.name
                .toLowerCase()
                .includes(text)

                ||

                item.code
                .toLowerCase()
                .includes(text)

            );

        });


    if (!product) {

        document
            .getElementById("notFound")
            .style.display = "block";

        document
            .getElementById("success")
            .style.display = "none";

        return;

    }


    document
        .getElementById("notFound")
        .style.display = "none";


    currentProductId =
        product.id;


    /*
        تعبئة البيانات
    */

    document
        .getElementById("name")
        .value =
        product.name || "";


    document
        .getElementById("code")
        .value =
        product.code || "";


    document
        .getElementById("brand")
        .value =
        product.brand || "";


    document
        .getElementById("type")
        .value =
        product.type || "";


    document
        .getElementById("color")
        .value =
        product.color || "";


    document
        .getElementById("price")
        .value =
        product.price || 0;


    document
        .getElementById("quantity")
        .value =
        product.quantity || 0;


    /*
        المقاسات
    */

    document
        .querySelectorAll(".size")
        .forEach(function(size) {

            size.classList.remove(
                "active"
            );

        });


    if (product.sizes) {

        product.sizes.forEach(
            function(savedSize) {

                document
                    .querySelectorAll(".size")
                    .forEach(
                        function(size) {

                            if (
                                size.dataset.size
                                ==
                                savedSize
                            ) {

                                size.classList.add(
                                    "active"
                                );

                            }

                        }
                    );

            }
        );

    }

}


/*
    حفظ التعديل
*/

document
    .getElementById("editForm")
    .addEventListener(
        "submit",
        function(event) {

            event.preventDefault();


            if (
                currentProductId === null
            ) {

                alert(
                    "ابحث عن المنتج أولاً"
                );

                return;

            }


            const selectedSizes = [];


            document
                .querySelectorAll(
                    ".size.active"
                )
                .forEach(function(size) {

                    selectedSizes.push(
                        size.dataset.size
                    );

                });


            products =
                products.map(
                    function(product) {

                        if (
                            product.id
                            ==
                            currentProductId
                        ) {

                            return {

                                id:
                                    product.id,

                                name:
                                    document
                                    .getElementById(
                                        "name"
                                    )
                                    .value,

                                code:
                                    document
                                    .getElementById(
                                        "code"
                                    )
                                    .value,

                                brand:
                                    document
                                    .getElementById(
                                        "brand"
                                    )
                                    .value,

                                type:
                                    document
                                    .getElementById(
                                        "type"
                                    )
                                    .value,

                                color:
                                    document
                                    .getElementById(
                                        "color"
                                    )
                                    .value,

                                price:
                                    document
                                    .getElementById(
                                        "price"
                                    )
                                    .value,

                                quantity:
                                    document
                                    .getElementById(
                                        "quantity"
                                    )
                                    .value,

                                sizes:
                                    selectedSizes

                            };

                        }


                        return product;

                    }
                );


            /*
                حفظ البيانات
            */

            localStorage.setItem(
                "products",
                JSON.stringify(products)
            );


            document
                .getElementById("success")
                .style.display = "block";


            setTimeout(
                function() {

                    document
                        .getElementById("success")
                        .style.display =
                        "none";

                },
                3000
            );

        }
    );


/*
    حذف المنتج الحالي
*/

function deleteCurrentProduct() {

    if (
        currentProductId === null
    ) {

        alert(
            "ابحث عن المنتج أولاً"
        );

        return;

    }


    const confirmDelete =
        confirm(
            "هل أنت متأكد من حذف المنتج؟"
        );


    if (!confirmDelete) {
        return;
    }


    products =
        products.filter(
            function(product) {

                return (
                    product.id
                    !=
                    currentProductId
                );

            }
        );


    localStorage.setItem(
        "products",
        JSON.stringify(products)
    );


    clearForm();


    alert(
        "تم حذف المنتج بنجاح"
    );

}


/*
    مسح الفورم
*/

function clearForm() {

    document
        .getElementById("editForm")
        .reset();


    document
        .getElementById("searchInput")
        .value = "";


    document
        .querySelectorAll(".size")
        .forEach(function(size) {

            size.classList.remove(
                "active"
            );

        });


    currentProductId = null;


    document
        .getElementById("notFound")
        .style.display = "none";

}

</script>

</body>

</html>
