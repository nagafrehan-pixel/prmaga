<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>المنتجات والمخزون</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Tahoma, sans-serif;
        }

        body {
            background: #f3f6fa;
            color: #172033;
        }

        /* الهيدر */

        header {
            background: #111827;
            color: white;

            padding: 20px 40px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 23px;
            font-weight: bold;
        }

        .logo span {
            color: #60a5fa;
        }

        /* المحتوى */

        .container {
            max-width: 1250px;
            margin: 35px auto;
            padding: 20px;
        }

        .title {
            margin-bottom: 25px;
        }

        .title h1 {
            font-size: 30px;
            margin-bottom: 8px;
        }

        .title p {
            color: #6b7280;
        }

        /* الإحصائيات */

        .stats {

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 15px;

            margin-bottom: 25px;
        }

        .stat {

            background: white;

            padding: 20px;

            border-radius: 15px;

            box-shadow:
                0 5px 20px rgba(0,0,0,0.06);
        }

        .stat h3 {

            font-size: 28px;

            margin-bottom: 7px;
        }

        .stat p {

            color: #6b7280;
        }

        .blue {
            color: #2563eb;
        }

        .green {
            color: #16a34a;
        }

        .red {
            color: #dc2626;
        }

        /* أدوات البحث */

        .tools {

            background: white;

            padding: 15px;

            border-radius: 15px;

            display: flex;

            gap: 10px;

            margin-bottom: 20px;
        }

        .tools input {

            flex: 1;

            padding: 14px;

            border:
                1px solid #d9dee7;

            border-radius: 10px;

            font-size: 16px;

            outline: none;
        }

        .tools select {

            padding: 14px;

            border:
                1px solid #d9dee7;

            border-radius: 10px;

            background: white;

            font-size: 15px;
        }

        /* الجدول */

        .table-container {

            background: white;

            border-radius: 15px;

            overflow-x: auto;

            box-shadow:
                0 5px 20px rgba(0,0,0,0.06);
        }

        table {

            width: 100%;

            border-collapse: collapse;

            min-width: 900px;
        }

        th {

            background: #f8fafc;

            padding: 16px;

            text-align: right;

            color: #475569;

        }

        td {

            padding: 15px;

            border-top:
                1px solid #edf0f4;
        }

        tr:hover {

            background: #f8fafc;
        }

        /* حالة المنتج */

        .status {

            display: inline-block;

            padding: 7px 12px;

            border-radius: 20px;

            font-size: 13px;

            font-weight: bold;
        }

        .available {

            background: #dcfce7;

            color: #166534;
        }

        .finished {

            background: #fee2e2;

            color: #991b1b;
        }

        .low {

            background: #fef3c7;

            color: #92400e;
        }

        /* الأزرار */

        button {

            border: none;

            padding: 8px 12px;

            border-radius: 8px;

            cursor: pointer;

            font-size: 14px;
        }

        .edit {

            background: #dbeafe;

            color: #1d4ed8;

        }

        .delete {

            background: #fee2e2;

            color: #b91c1c;

            margin-right: 5px;

        }

        /* عدم وجود منتجات */

        .empty {

            text-align: center;

            padding: 60px;

            color: #64748b;

        }

        /* الموبايل */

        @media(max-width:800px) {

            .stats {

                grid-template-columns:
                    repeat(2, 1fr);

            }

            .tools {

                flex-direction: column;

            }

            header {

                padding: 18px;

            }

        }

    </style>

</head>


<body>


<header>

    <div class="logo">

        👟 <span>شركة الكوتشيات</span>

    </div>

    <div>

        المنتجات والمخزون

    </div>

</header>



<div class="container">


    <div class="title">

        <h1>📦 المنتجات والمخزون</h1>

        <p>
            متابعة جميع المنتجات والكميات والأسعار
        </p>

    </div>



    <!-- الإحصائيات -->

    <div class="stats">


        <div class="stat">

            <h3
                class="blue"
                id="totalProducts">
                0
            </h3>

            <p>
                إجمالي المنتجات
            </p>

        </div>


        <div class="stat">

            <h3
                class="green"
                id="totalQuantity">
                0
            </h3>

            <p>
                إجمالي القطع
            </p>

        </div>


        <div class="stat">

            <h3
                class="red"
                id="finishedProducts">
                0
            </h3>

            <p>
                منتجات خلصانة
            </p>

        </div>


        <div class="stat">

            <h3
                class="blue"
                id="inventoryValue">
                0
            </h3>

            <p>
                قيمة المخزون
            </p>

        </div>


    </div>



    <!-- البحث والفلترة -->

    <div class="tools">

        <input
            type="text"
            id="search"
            placeholder="🔎 ابحث باسم المنتج أو الكود أو الماركة..."
        >


        <select id="filter">

            <option value="all">
                كل المنتجات
            </option>

            <option value="available">
                المتوفر فقط
            </option>

            <option value="low">
                قرب يخلص
            </option>

            <option value="finished">
                الخالص
            </option>

        </select>

    </div>



    <!-- جدول المنتجات -->

    <div class="table-container">

        <table>

            <thead>

                <tr>

                    <th>
                        الكود
                    </th>

                    <th>
                        اسم المنتج
                    </th>

                    <th>
                        الماركة
                    </th>

                    <th>
                        النوع
                    </th>

                    <th>
                        السعر
                    </th>

                    <th>
                        الكمية
                    </th>

                    <th>
                        الحالة
                    </th>

                    <th>
                        الإجراءات
                    </th>

                </tr>

            </thead>


            <tbody id="productsTable">

            </tbody>

        </table>

    </div>


</div>



<script>


    /*
        قراءة المنتجات
        التي تم حفظها
        من صفحة إضافة المنتج
    */

    let products =
        JSON.parse(
            localStorage.getItem("products")
        ) || [];



    /*
        عناصر الصفحة
    */

    const table =
        document.getElementById(
            "productsTable"
        );


    const search =
        document.getElementById(
            "search"
        );


    const filter =
        document.getElementById(
            "filter"
        );



    /*
        عرض المنتجات
    */

    function displayProducts() {


        let searchText =
            search.value
            .trim()
            .toLowerCase();


        let filterValue =
            filter.value;


        let result =
            products.filter(
                function(product) {


                    /*
                        البحث
                    */

                    const matchesSearch =

                        product.name
                        .toLowerCase()
                        .includes(searchText)

                        ||

                        product.code
                        .toLowerCase()
                        .includes(searchText)

                        ||

                        product.brand
                        .toLowerCase()
                        .includes(searchText);



                    /*
                        الفلترة
                    */

                    let matchesFilter =
                        true;


                    if (
                        filterValue ===
                        "available"
                    ) {

                        matchesFilter =
                            product.quantity > 2;

                    }


                    if (
                        filterValue ===
                        "low"
                    ) {

                        matchesFilter =
                            product.quantity > 0
                            &&
                            product.quantity <= 2;

                    }


                    if (
                        filterValue ===
                        "finished"
                    ) {

                        matchesFilter =
                            product.quantity == 0;

                    }


                    return (
                        matchesSearch
                        &&
                        matchesFilter
                    );

                }
            );



        /*
            تنظيف الجدول
        */

        table.innerHTML = "";



        /*
            لا توجد منتجات
        */

        if (
            result.length === 0
        ) {

            table.innerHTML = `

                <tr>

                    <td
                        colspan="8"
                        class="empty">

                        📦
                        <br><br>

                        لا توجد منتجات

                    </td>

                </tr>

            `;

            return;

        }



        /*
            إنشاء الصفوف
        */

        result.forEach(
            function(product) {


                let status = "";

                let statusClass = "";



                if (
                    product.quantity == 0
                ) {

                    status =
                        "🔴 خلصان";

                    statusClass =
                        "finished";

                }

                else if (
                    product.quantity <= 2
                ) {

                    status =
                        "🟡 قرب يخلص";

                    statusClass =
                        "low";

                }

                else {

                    status =
                        "🟢 متوفر";

                    statusClass =
                        "available";

                }



                const row =
                    document.createElement(
                        "tr"
                    );



                row.innerHTML = `

                    <td>
                        ${product.code}
                    </td>

                    <td>
                        <strong>
                            ${product.name}
                        </strong>
                    </td>

                    <td>
                        ${product.brand || "-"}
                    </td>

                    <td>
                        ${product.type || "-"}
                    </td>

                    <td>
                        ${Number(
                            product.price
                        ).toLocaleString()}
                        جنيه
                    </td>

                    <td>
                        ${product.quantity}
                    </td>

                    <td>

                        <span
                            class="status
                            ${statusClass}">

                            ${status}

                        </span>

                    </td>

                    <td>

                        <button
                            class="edit"
                            onclick="editProduct(
                                ${product.id}
                            )">

                            ✏️ تعديل

                        </button>


                        <button
                            class="delete"
                            onclick="deleteProduct(
                                ${product.id}
                            )">

                            🗑️ حذف

                        </button>

                    </td>

                `;


                table.appendChild(row);

            }
        );


    }



    /*
        الإحصائيات
    */

    function updateStats() {


        const totalProducts =
            products.length;


        const totalQuantity =
            products.reduce(
                function(total, product) {

                    return total +
                        Number(
                            product.quantity
                        );

                },
                0
            );


        const finished =
            products.filter(
                function(product) {

                    return product.quantity == 0;

                }
            ).length;


        const value =
            products.reduce(
                function(total, product) {

                    return total +

                        (
                            Number(
                                product.price
                            )

                            *

                            Number(
                                product.quantity
                            )
                        );

                },
                0
            );



        document
            .getElementById(
                "totalProducts"
            )
            .textContent =
            totalProducts;



        document
            .getElementById(
                "totalQuantity"
            )
            .textContent =
            totalQuantity;



        document
            .getElementById(
                "finishedProducts"
            )
            .textContent =
            finished;



        document
            .getElementById(
                "inventoryValue"
            )
            .textContent =

            value.toLocaleString()
            +
            " جنيه";

    }



    /*
        حذف المنتج
    */

    function deleteProduct(id) {


        const confirmDelete =
            confirm(
                "هل تريد حذف هذا المنتج؟"
            );


        if (!confirmDelete) {

            return;

        }


        products =
            products.filter(
                function(product) {

                    return product.id != id;

                }
            );


        localStorage.setItem(
            "products",
            JSON.stringify(products)
        );


        displayProducts();

        updateStats();

    }



    /*
        تعديل المنتج
    */

    function editProduct(id) {


        const product =
            products.find(
                function(item) {

                    return item.id == id;

                }
            );


        if (!product) {

            return;

        }


        /*
            في المرحلة القادمة
            هنفتح صفحة التعديل
            تلقائياً
        */

        alert(
            "المنتج: "
            +
            product.name
            +
            "\n\n"
            +
            "هنضيف صفحة تعديل المنتج في الخطوة القادمة."
        );

    }



    /*
        البحث
    */

    search.addEventListener(
        "input",
        displayProducts
    );


    /*
        الفلترة
    */

    filter.addEventListener(
        "change",
        displayProducts
    );



    /*
        تشغيل الصفحة
    */

    displayProducts();

    updateStats();


</script>


</body>

</html>
